interface:
  display_name: "Verify Proof"
  short_description: "Verify a result and attempt its gated fact write"
  default_prompt: "Use $verify-proof to verify a result and, on acceptance, attempt the locked context-CAS/add via fact_submit (glossary-coverage check, verifier call, explicit write_error on stale context; the verification trace is auto-logged to global memory)."

policy:
  allow_implicit_invocation: true
